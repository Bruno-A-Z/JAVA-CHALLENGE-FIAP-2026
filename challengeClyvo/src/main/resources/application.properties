spring.application.name=challengeClyvo

# Banco de dados (Azure SQL / SQL Server) - valores vem de variaveis de ambiente.
# No GitHub Actions: Settings > Secrets and variables > Actions.
# No Azure Web App: Settings > Environment variables (App settings).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}

app.security.vet.username=${VET_USERNAME:veterinario}
app.security.vet.password=${VET_PASSWORD:vet123}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true

server.port=${PORT:8080}
