<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pets')}"></head>
<body>
<div th:replace="~{fragments/layout :: menu}"></div>

<h1>Pets</h1>
<a th:href="@{/web/pet/novo}">+ Novo Pet</a>

<table th:if="${!pets.empty}">
    <thead>
    <tr>
        <th>ID</th><th>Nome</th><th>Espécie</th><th>Raça</th><th>Idade</th><th>Peso</th><th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <th:block th:each="pet : ${pets.content}">
        <tr>
            <td th:text="${pet.id}">1</td>
            <td>
                <a href="#" class="expansor" th:attr="data-alvo=${'detalhe-pet-' + pet.id}"
                   title="Clique para ver os tutores" th:text="${pet.nome}">Nome</a>
            </td>
            <td th:text="${pet.especie}">Espécie</td>
            <td th:text="${pet.raca}">Raça</td>
            <td th:text="${pet.idade}">3</td>
            <td th:text="${pet.peso}">10.0</td>
            <td>
                <a th:href="@{/web/pet/{id}/editar(id=${pet.id})}">Editar</a>
                <form th:action="@{/web/pet/{id}/deletar(id=${pet.id})}" method="post" style="display:inline;">
                    <button type="submit" onclick="return confirm('Confirma exclusão?')">Excluir</button>
                </form>
            </td>
        </tr>
        <tr class="detalhe" hidden th:id="${'detalhe-pet-' + pet.id}">
            <td colspan="7">
                <strong>Tutores de <span th:text="${pet.nome}">Pet</span>:</strong>
                <ul th:if="${!tutoresPorPet[pet.id].isEmpty()}">
                    <li th:each="tutor : ${tutoresPorPet[pet.id]}">
                        <span th:text="${tutor.nome}">Tutor</span>
                        &middot; Tel: <span th:text="${tutor.tel}">11999999999</span>
                        &middot; CPF: <span th:text="${tutor.cpf}">12345678900</span>
                    </li>
                </ul>
                <p th:if="${tutoresPorPet[pet.id].isEmpty()}" class="vazio">
                    Nenhum tutor vinculado.
                    <a th:href="@{/web/pet/{id}/editar(id=${pet.id})}">Vincular tutor</a>
                </p>
            </td>
        </tr>
    </th:block>
    </tbody>
</table>

<p class="vazio-lista" th:if="${pets.empty}">Nenhum pet cadastrado ainda. <a th:href="@{/web/pet/novo}">Cadastrar o primeiro pet</a></p>

<div th:if="${!pets.first}"><a th:href="@{/web/pet(pagina=${pets.number - 1})}">Anterior</a></div>
<span th:if="${!pets.empty}" th:text="'Página ' + (${pets.number} + 1) + ' de ' + ${pets.totalPages}"></span>
<div th:if="${!pets.last}"><a th:href="@{/web/pet(pagina=${pets.number + 1})}">Próxima</a></div>
</body>
</html>
