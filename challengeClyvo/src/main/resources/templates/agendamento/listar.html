<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Agendamentos')}"></head>
<body>
<div th:replace="~{fragments/layout :: menu}"></div>

<h1>Agendamentos</h1>
<a th:href="@{/web/agendamento/novo}">+ Novo Agendamento</a>

<table th:if="${!agendamentos.empty}">
    <thead>
    <tr><th>ID</th><th>Data/Hora</th><th>Pet</th><th>Veterinário</th><th>Status</th><th>Motivo</th><th>Ações</th></tr>
    </thead>
    <tbody>
    <tr th:each="ag : ${agendamentos.content}">
        <td th:text="${ag.id}">1</td>
        <td th:text="${#temporals.format(ag.dataHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
        <td th:text="${nomesPets[ag.idPet]}">Pet</td>
        <td th:text="${nomesVeterinarios[ag.idVeterinario]}">Veterinário</td>
        <td><span class="status" th:classappend="${'status-' + ag.status.name().toLowerCase()}" th:text="${ag.status}">AGENDADO</span></td>
        <td th:text="${ag.motivo}">Motivo</td>
        <td>
            <form th:if="${ag.status.name() == 'AGENDADO'}"
                  th:action="@{/web/agendamento/{id}/cancelar(id=${ag.id})}" method="post" style="display:inline;">
                <button type="submit" onclick="return confirm('Cancelar agendamento?')">Cancelar</button>
            </form>
            <a th:if="${ag.status.name() == 'AGENDADO'}"
               th:href="@{/web/consulta/agendamento/{id}/realizar(id=${ag.id})}">Realizar Consulta</a>
        </td>
    </tr>
    </tbody>
</table>

<p class="vazio-lista" th:if="${agendamentos.empty}">Nenhum agendamento ainda. <a th:href="@{/web/agendamento/novo}">Criar o primeiro agendamento</a></p>

<div th:if="${!agendamentos.first}"><a th:href="@{/web/agendamento(pagina=${agendamentos.number - 1})}">Anterior</a></div>
<span th:if="${!agendamentos.empty}" th:text="'Página ' + (${agendamentos.number} + 1) + ' de ' + ${agendamentos.totalPages}"></span>
<div th:if="${!agendamentos.last}"><a th:href="@{/web/agendamento(pagina=${agendamentos.number + 1})}">Próxima</a></div>
</body>
</html>
