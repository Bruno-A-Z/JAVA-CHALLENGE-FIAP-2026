<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modoEdicao} ? 'Editar Tutor' : 'Novo Tutor')}"></head>
<body class="app">
<div th:replace="~{fragments/layout :: menu}"></div>

<main class="conteudo">

    <a class="link-voltar" th:href="@{/web/tutor}">Voltar para tutores</a>
    <header class="cabecalho">
        <h1 th:text="${modoEdicao} ? 'Editar tutor' : 'Novo tutor'">Tutor</h1>
    </header>

    <form class="form-card"
          th:action="${modoEdicao} ? @{/web/tutor/{id}(id=${id})} : @{/web/tutor}"
          th:object="${tutor}"
          method="post">

        <div class="form-grade">
            <div class="campo largo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}"
                       th:classappend="${#fields.hasErrors('nome')} ? 'invalido'">
                <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="campo">
                <label for="idade">Idade</label>
                <input type="number" id="idade" th:field="*{idade}"
                       th:classappend="${#fields.hasErrors('idade')} ? 'invalido'">
                <span class="erro-campo" th:if="${#fields.hasErrors('idade')}" th:errors="*{idade}"></span>
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" th:field="*{cpf}" placeholder="000.000.000-00"
                       th:classappend="${#fields.hasErrors('cpf')} ? 'invalido'">
                <span class="erro-campo" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span>
            </div>

            <div class="campo">
                <label for="tel">Telefone</label>
                <input type="text" id="tel" th:field="*{tel}"
                       th:classappend="${#fields.hasErrors('tel')} ? 'invalido'">
                <span class="erro-campo" th:if="${#fields.hasErrors('tel')}" th:errors="*{tel}"></span>
            </div>

            <div class="campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" th:field="*{endereco}">
            </div>
        </div>

        <div class="form-acoes">
            <button type="submit" class="btn btn-primario">Salvar tutor</button>
            <a class="btn btn-secundario" th:href="@{/web/tutor}">Cancelar</a>
        </div>
    </form>

    <!-- Pets de que este tutor cuida -->
    <section class="bloco" th:if="${modoEdicao}">
        <h2>Pets deste tutor</h2>
        <ul th:if="${!petsDoTutor.isEmpty()}">
            <li th:each="pet : ${petsDoTutor}">
                <a th:href="@{/web/pet/{id}/editar(id=${pet.id})}" th:text="${pet.nome}">Pet</a>
                <small th:text="${pet.especie}">Espécie</small>
            </li>
        </ul>
        <p th:if="${petsDoTutor.isEmpty()}" class="vazio">
            Nenhum pet vinculado a este tutor. O vínculo é feito na tela de edição do pet.
        </p>
    </section>

</main>
</body>
</html>
