<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modoEdicao} ? 'Editar Tutor' : 'Novo Tutor')}"></head>
<body>
<div th:replace="~{fragments/layout :: menu}"></div>

<h1 th:text="${modoEdicao} ? 'Editar Tutor' : 'Novo Tutor'">Tutor</h1>

<form th:action="${modoEdicao} ? @{/web/tutor/{id}(id=${id})} : @{/web/tutor}"
      th:object="${tutor}"
      method="post">

    <div>
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}">
        <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:red;"></span>
    </div>

    <div>
        <label for="idade">Idade</label>
        <input type="number" id="idade" th:field="*{idade}">
        <span th:if="${#fields.hasErrors('idade')}" th:errors="*{idade}" style="color:red;"></span>
    </div>

    <div>
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" th:field="*{endereco}">
    </div>

    <div>
        <label for="tel">Telefone</label>
        <input type="text" id="tel" th:field="*{tel}">
        <span th:if="${#fields.hasErrors('tel')}" th:errors="*{tel}" style="color:red;"></span>
    </div>

    <div>
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" th:field="*{cpf}">
        <span th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" style="color:red;"></span>
    </div>

    <button type="submit">Salvar</button>
    <a th:href="@{/web/tutor}">Cancelar</a>
</form>

<!-- Pets de que este tutor cuida -->
<section class="bloco" th:if="${modoEdicao}">
    <h2>Pets deste tutor</h2>
    <ul th:if="${!petsDoTutor.isEmpty()}">
        <li th:each="pet : ${petsDoTutor}">
            <a th:href="@{/web/pet/{id}/editar(id=${pet.id})}" th:text="${pet.nome}">Pet</a>
            <small th:text="${pet.especie}">Espécie</small>
        </li>
    </ul>
    <p th:if="${petsDoTutor.isEmpty()}" class="vazio">Nenhum pet vinculado a este tutor.</p>
</section>
</body>
</html>
