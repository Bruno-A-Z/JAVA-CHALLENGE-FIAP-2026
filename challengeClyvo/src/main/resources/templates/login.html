<!-- templates/login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="login-pagina">

<section class="login-lado">
    <div class="marca"><span class="marca-nome">Clyvo</span></div>
    <div>
        <h1>Tutores, pets e consultas da clínica.</h1>
        <p>Entre com seu usuário para ver a agenda e registrar atendimentos.</p>
    </div>
</section>

<main class="login-area">
    <form class="login-form" method="post" th:action="@{/web/login}">
        <h2>Entrar</h2>

        <p class="aviso aviso-erro" role="alert" th:if="${param.erro}">Usuário ou senha inválidos.</p>
        <p class="aviso aviso-ok" th:if="${param.logout}">Você saiu do sistema.</p>

        <div class="campo">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        </div>

        <div class="campo">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button class="btn btn-primario btn-cheio" type="submit">Entrar</button>
    </form>
</main>

</body>
</html>
