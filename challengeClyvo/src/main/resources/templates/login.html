<!-- templates/login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<h1>Login</h1>

<p th:if="${param.erro}" style="color:red;">Usuário ou senha inválidos.</p>
<p th:if="${param.logout}" style="color:green;">Você saiu do sistema.</p>

<form method="post" th:action="@{/web/login}">
    <div>
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required>
    </div>

    <div>
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit">Entrar</button>
</form>
</body>
</html>
