# Pipeline do Azure DevOps: build com Maven e deploy no Azure Web App
# Equivalente ao workflow do GitHub Actions (.github/workflows/master_webapp-clyvo-care.yml)

trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  # Nome da Service connection (Project settings > Service connections > Azure Resource Manager)
  azureServiceConnection: 'COLOQUE-AQUI-O-NOME-DA-SERVICE-CONNECTION'
  webAppName: 'webapp-clyvo-care'
  workingDir: 'challengeClyvo'

steps:
  - task: JavaToolInstaller@0
    displayName: 'Set up Java 21'
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # SPRING_DATASOURCE_* sao variaveis secretas do pipeline (Edit > Variables > Keep this value secret).
  # Variaveis secretas nao viram variaveis de ambiente sozinhas: o bloco env abaixo faz o mapeamento.
  - script: mvn clean install
    displayName: 'Build with Maven'
    workingDirectory: $(workingDir)
    env:
      SPRING_DATASOURCE_URL: $(SPRING_DATASOURCE_URL)
      SPRING_DATASOURCE_USERNAME: $(SPRING_DATASOURCE_USERNAME)
      SPRING_DATASOURCE_PASSWORD: $(SPRING_DATASOURCE_PASSWORD)

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure Web App'
    inputs:
      azureSubscription: $(azureServiceConnection)
      appType: 'webAppLinux'
      appName: $(webAppName)
      package: '$(System.DefaultWorkingDirectory)/$(workingDir)/target/*.jar'
